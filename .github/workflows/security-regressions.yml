name: BeamSync security regression tests
on:
  push:
    branches:
      - security/daybreak-fixes-20261119
  pull_request:
    paths:
      - 'public/js/**'
      - 'lib/**'
      - '.github/workflows/security-regressions.yml'
jobs:
  verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Entire BeamSync verification suite
        run: node --test lib/verification/*.test.cjs
      - name: Syntax checks
        run: |
          find public/js public -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          find lib/optional-one-scan/lib api -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
